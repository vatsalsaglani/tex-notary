name: Desktop Release

on:
  create:
  push:
    branches:
      - "v*"
      - "version/v*"

permissions:
  contents: write

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'create' &&
        github.event.ref_type == 'branch' &&
        (
          startsWith(github.event.ref, 'v') || startsWith(github.event.ref, 'version/v')
        )
      )
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'create' && github.event.ref || github.ref_name }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          RAW_REF="${{ github.event_name == 'create' && github.event.ref || github.ref_name }}"
          VERSION="${RAW_REF#version/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Sync desktop package version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DESKTOP_VERSION="${VERSION#v}"
          npm version "${DESKTOP_VERSION}" --no-git-tag-version -w @overleaf-lite/desktop

      - name: Bundle desktop tooling for runner OS
        run: npm run prepare:tools -w @overleaf-lite/desktop

      - name: Build desktop artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:desktop

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/**/*.dmg
            apps/desktop/dist/**/*.zip
            apps/desktop/dist/**/*.exe
            apps/desktop/dist/**/*.AppImage
            apps/desktop/dist/**/*.deb

  release:
    needs: build
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'create' &&
        github.event.ref_type == 'branch' &&
        (
          startsWith(github.event.ref, 'v') || startsWith(github.event.ref, 'version/v')
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'create' && github.event.ref || github.ref_name }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          RAW_REF="${{ github.event_name == 'create' && github.event.ref || github.ref_name }}"
          VERSION="${RAW_REF#version/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create release tag if missing
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git fetch --tags
          if git show-ref --verify --quiet "refs/tags/${VERSION}"; then
            echo "Tag ${VERSION} already exists"
          else
            git tag "${VERSION}" "${GITHUB_SHA}"
            git push origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: TeX Notary ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release-artifacts/**/*
