<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fcd09d" />
      <stop offset="50%" stop-color="#fcfaf6" />
      <stop offset="100%" stop-color="#8cdad3" />
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bg-gradient)" />

  <g filter="url(#dropShadow)">
    <rect x="112" y="80" width="288" height="352" rx="8" fill="#FFFFFF" />

    <path d="M 336 80 L 400 144 L 336 144 Z" fill="#E2E2E2" />
    <path d="M 400 144 L 400 80 L 336 80 Z" fill="#F0F0F0" />
  </g>

  <g fill="#382a1f" opacity="0.15">
    <rect x="144" y="128" width="160" height="16" rx="4" />
    <rect x="144" y="168" width="224" height="8" rx="2" />
    <rect x="144" y="188" width="200" height="8" rx="2" />
    <rect x="144" y="208" width="224" height="8" rx="2" />
    <rect x="144" y="228" width="180" height="8" rx="2" />

    <rect x="144" y="268" width="100" height="12" rx="3" />
    <rect x="144" y="300" width="224" height="8" rx="2" />
    <rect x="144" y="320" width="160" height="8" rx="2" />
  </g>

  <g transform="translate(330, 350)">
    <path d="M 10 20 L -10 80 L 15 70 L 40 80 L 20 20 Z" fill="#177366" opacity="0.8" transform="rotate(-15)"/>
    <path d="M -10 20 L -35 80 L -10 70 L 15 80 L 0 20 Z" fill="#125A50" opacity="0.8" transform="rotate(15)"/>

    <circle cx="0" cy="0" r="55" fill="#177366" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#125A50" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>

    <text x="0" y="18" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="bold" font-size="54" fill="#FFFFFF">{ }</text>
  </g>
</svg>
